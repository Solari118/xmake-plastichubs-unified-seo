name: manufacturing-content-pipeline
version: 1
canonical_order:
  - plan
  - info
  - audit
  - b2b-image
  - final-output
entry_detection:
  topic_or_keyword: plan
  accepted_plan_brief: info
  article_draft: audit
  audited_article_without_assets: b2b-image
  audited_article_with_assets: final-output
  standalone_image: b2b-image
transitions:
  plan:
    pass: info
    keyword_approval_required: WAITING_FOR_KEYWORD_APPROVAL
    blocked: BLOCKED
  info:
    pass: audit
    blocked: BLOCKED
  audit:
    pass: b2b-image
    info_rollback: info
    plan_rollback: plan
    user_guidance_required: BLOCKED
  b2b-image:
    article_assets_complete: final-output
    standalone_complete: PHASE_COMPLETED
    blocked: BLOCKED
  final-output:
    pass: COMPLETED
    structural_only: COMPLETED
    blocked: BLOCKED
limits:
  audit_repair_cycles: 2
  image_attempts_per_asset: 2
artifact_mutation: immutable_versioned_successor

