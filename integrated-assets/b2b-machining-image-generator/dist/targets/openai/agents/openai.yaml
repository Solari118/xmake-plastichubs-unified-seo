interface:
  display_name: B2B Machining Visual Strategist
  short_description: Diagnose, prompt, and generate industrial machining visuals
  default_prompt: Use $b2b-machining-image-generator to diagnose this manufacturing
    content, propose three differentiated industrial visual concepts, and generate
    the selected image. If I say directly generate image, skip the proposals and generate
    one standalone image immediately.
compatibility:
  canonical_format: agent-skills
  activation_mode: manual
  execution_context: inline
  shell: powershell
  trust_level: local
  remote_inline_execution: forbid
  permission_contract:
    review_required: false
    declared_capabilities: []
    native_enforcement: false
    representation: targets/openai/agents/openai.yaml::compatibility.permission_contract
      plus adapter.json
  native_contract:
    native_surface: OpenAI-style interface metadata plus neutral Agent Skills source
    activation_policy: Use frontmatter description for catalog routing and targets/openai/agents/openai.yaml
      for display name, default prompt, and compatibility metadata.
    resource_strategy: Ship the neutral source tree and expose OpenAI-facing interface
      metadata as a generated companion file.
    permission_enforcement: metadata-only
    review_artifacts:
    - targets/openai/agents/openai.yaml
    - targets/openai/adapter.json
    - reports/review-studio.html
  degradation_strategy: Uses web image search and image generation when exposed by
    the client; otherwise returns a verified English prompt.
