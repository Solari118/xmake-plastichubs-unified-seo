interface:
  display_name: "B2B SEO/GEO Content Planner"
  short_description: "Plan intent-complete manufacturing content and handoff contracts"
  default_prompt: "Use $b2b-seo-topic-map-builder. State the Plan route, stage, and deliverable; then build the complete writer-ready brief and Top-5 SERP benchmark without drafting the article."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "codex"
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    codex: "native-skill-source"
    generic: "neutral-source"
