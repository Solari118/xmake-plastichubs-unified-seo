interface:
  display_name: "B2B SEO/GEO Content Planner"
  short_description: "Build manufacturing content briefs and topic maps."
  default_prompt: "Use $b2b-seo-topic-map-builder. State the Plan route, stage, and deliverable; analyze the live Google Top-10 as a dynamic pattern library; if Google requires verification, open the exact query in the in-app browser and wait for the user, and never downgrade to Best-effort without explicit approval; select one primary structure/style/rhythm controller; emit SECTION_REFERENCE_MAP with Top-10 sources, sequence index/reason, heading-scope mode, reader question, first-paragraph answer, and scope for every planned H2; require a varied FAQ and visible CTA; explicitly justify any core section after FAQ; and produce a passing writer-ready brief with verified internal links."
