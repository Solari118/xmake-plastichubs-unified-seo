interface:
  display_name: "SEO/GEO Content Auditor"
  short_description: "Audit manufacturing content with hard gates"
  default_prompt: "Use $seo-geo-content-auditor. State the Audit route, stage, and deliverable; audit the article against its brief and live Top-10 pattern contract; verify hierarchy, title alignment, answer timing, narrative order, table/list placement, complexity, natural English, FAQ, CTA, internal links, and semantic/shape corpus diversity; treat machine-gate failures as hard fails; route strategy defects to Plan and execution defects to Info; allow Final Output only after GREEN."
