name: manufacturing-content-pipeline
description: Top-10 reference planning to varied writing, corpus audit, images, linked output, and performance review
version: 5.2.0
instructions: AGENTS.md
default_skill: manufacturing-content-pipeline
skills:
  directory: skills
  discovery_mirrors:
    - .agents/skills
    - .codex/skills
agents:
  directory: agents
  auxiliary:
    - seo-data-agent
    - seo-opportunity-orchestrator
    - seo-technical-preflight-agent
    - seo-health-check-agent
    - seo-learning-governor-agent
extensions:
  agentic_seo: extensions/agentic-seo/extension.yaml
  installed_inactive:
    link_building: extensions/link-building/extension.yaml
collaboration_outputs:
  slack:
    mode: optional
    failure_policy: warning_non_blocking
  google_sheets:
    mode: optional
    failure_policy: warning_non_blocking
workflow:
  state_machine: workflows/article-pipeline.yaml
  handoff_contract: workflows/handoff-contract.md
policies:
  context_isolation: policies/context-isolation.md
  capability_preservation: policies/capability-preservation.md
  private_resources: policies/private-resource-policy.md
resources:
  private_registry: config/private-resource-sources.yaml
  local_copy_root: knowledge/private-resources
  packaging_gate: scripts/assert_private_packaging_scope.ps1
validation:
  command: python scripts/validate_project.py
