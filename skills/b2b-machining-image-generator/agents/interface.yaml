interface:
  display_name: "B2B Machining Visual Strategist"
  short_description: "Diagnose, generate, and retouch industrial machining visuals"
  default_prompt: "Use $b2b-machining-image-generator to diagnose this manufacturing content. For an audited article, deliver at least three independent section-mapped images with distinct visual jobs; for a standalone image, propose three differentiated concepts unless I request direct generation or direct editing. Apply the eight-minute, one-retry limits per asset."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "powershell"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "Uses web image search and image generation when exposed by the client; otherwise returns a verified English prompt."
    generic: "Prompt-only fallback when image search or generation tools are unavailable."
